[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privai"
version = "0.1.0"
description = "AI-powered behavioral web privacy and data-transmission guard"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]